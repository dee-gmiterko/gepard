appId: io.github.dee-gmiterko.gepard
productName: Gepard
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,README.md}'
  - '!{.env,.env.*,.npmrc,yarn.lock}'
  - '!tsconfig.json'
  - '!resources/**'
  - '!scripts/**'
  - '!.yarn/**'
  # electron is a devDependency, but @electron-toolkit/utils' peerDependencies.electron
  # resolves against it in the installed tree, so electron-builder's module collector
  # treats electron and its download toolchain as production dependencies.
  - '!**/node_modules/{electron,debug,ms,semver,progress,sumchecker,undici,undici-types,graceful-fs,env-paths}{,/**/*}'
  - '!**/node_modules/@electron/get{,/**/*}'
  - '!**/node_modules/@electron-internal/extract-zip{,/**/*}'
  - '!**/node_modules/@types/node{,/**/*}'
  # react is a devDependency, but markdown-to-jsx declares it as a peerDependency,
  # so electron-builder's module collector treats react and react-dom as production
  # dependencies too.
  - '!**/node_modules/{react,react-dom}{,/**/*}'
# Electron cannot execute binaries from inside an asar archive.
asarUnpack:
  - '**/@vscode/ripgrep-*/bin/**'
extraResources:
  - from: ../../extensions
    to: extensions
    filter:
      - '*/*/dist/**'
      - '*/*/vendor/**'
      - '*/*/package.json'
      - '*/*/index.mjs'
      - '*/*/messages.json'
      - '*/*/{LICENSE,README.md,THIRD_PARTY_LICENSES,UPSTREAM_LICENSE}'
win:
  executableName: Gepard
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
  maintainer: 'dee-gmiterko <d.gmiterko@gmail.com>'
  category: Utility
  syncDesktopName: true
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: dee-gmiterko
  repo: gepard
